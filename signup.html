
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | Quiz App</title>
    <link rel="stylesheet" href="style.css">
    <script src="signup.js" defer></script>
</head>
<body>
    <main class="auth-container">
        <section class="auth-card">
            <div class="auth-header">
                <div class="app-logo">Q</div>
                <h1>Create Account</h1>
                <p>Register to start your quiz journey.</p>
            </div>

            <form id="signupForm" novalidate>
                <div class="form-group">
                    <label for="name">Username</label>
                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your username"
                        autocomplete="username"
                        required
                    >
                    <small id="errorname" class="error"></small>
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="you@example.com"
                        autocomplete="email"
                        required
                    >
                    <small id="erroremail" class="error"></small>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        placeholder="At least 8 characters"
                        autocomplete="new-password"
                        required
                    >
                    <small id="errorpassword" class="error"></small>
                </div>

                <div class="form-group">
                    <label for="age">Age</label>
                    <input
                        type="number"
                        id="age"
                        placeholder="Enter your age"
                        min="1"
                        max="120"
                        required
                    >
                    <small id="errorage" class="error"></small>
                </div>

                <div class="form-group">
                    <label for="country">Country</label>
                    <select id="country" required>
                        <option value="">Select your country</option>
                        <option value="Pakistan">Pakistan</option>
                        <option value="India">India</option>
                        <option value="China">China</option>
                        <option value="South Africa">South Africa</option>
                    </select>
                    <small id="errorcountry" class="error"></small>
                </div>

                <div class="form-group">
                    <label for="dob">Date of Birth</label>
                    <input type="date" id="dob" required>
                    <small id="errordob" class="error"></small>
                </div>

                <button type="submit" id="signBtn">Create Account</button>
            </form>

            <div class="auth-footer">
                <p>
                    Already registered?
                    <a href="index.html">Sign In</a>
                </p>
            </div>
        </section>
    </main>
</body>
</html>
